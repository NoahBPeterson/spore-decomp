# Fills the caches the byte-match check restores: the WineHQ .deb files, the extracted compilers + wine prefix, and the
# open-source library downloads (tools/ci/setup_oss.sh).
# pull_request_target runs may read caches but not write them ("token has no writable scopes"), so this runs on main:
# on demand, weekly (GitHub drops a cache unused for 7 days), and when the setup scripts change. Keys must match
# byte-match.yml.
name: Warm the byte-match caches

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths:
      - .github/workflows/byte-match.yml
      - .github/workflows/warm-caches.yml
      - tools/ci/setup_toolchain.sh
      - tools/ci/toolchain.sha256
      - tools/ci/is_unpack.py
      - tools/ci/setup_oss.sh
      - tools/ci/wine_root.sh

permissions:
  contents: read

concurrency:
  group: warm-caches
  cancel-in-progress: false

jobs:
  warm:
    # a fork with Actions enabled runs these too (one pushed its own claims branch every 30 minutes)
    if: github.repository == 'NoahBPeterson/spore-decomp'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Look up the installed-wine archive
        id: wineroot
        uses: actions/cache/restore@v4
        with:
          path: ~/wine-root
          key: wine-root-noble-v1
          lookup-only: true

      - name: Restore the cached wine packages
        id: aptcache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-noble-winehq-v1

      # exactly byte-match.yml's install, recorded by wine_root.sh (made once: to pick up a new wine or new packages,
      # bump wine-root-noble-vN here and in byte-match.yml); then the recommended packages are downloaded too, for
      # install_cached_debs.sh when no Ubuntu mirror is reachable
      - name: Install wine (as byte-match.yml does) and archive what apt wrote
        run: |
          mkdir -p ~/apt-archives/partial
          sh tools/ci/wine_root.sh mark
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -qO /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -qNP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sh tools/ci/apt_update.sh
          sudo NEEDRESTART_SUSPEND=1 DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" winehq-stable msitools xvfb >/dev/null
          if [ "${{ steps.wineroot.outputs.cache-hit }}" != true ]; then sh tools/ci/wine_root.sh save ~/wine-root; fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --download-only --install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" winehq-stable msitools xvfb >/dev/null
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          echo "WINE_VERSION=$(wine --version)" >> "$GITHUB_ENV"
          du -sh ~/apt-archives

      - name: Save the installed-wine archive
        if: steps.wineroot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/wine-root
          key: wine-root-noble-v1

      - name: Save the wine packages
        if: steps.aptcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: apt-noble-winehq-v1

      - name: Restore the installers
        uses: actions/cache@v4
        with:
          path: work/toolchain/downloads
          key: msvc-installers-7800d037-50dc6cca

      - name: Restore the extracted toolchains and wine prefix
        id: tccache
        uses: actions/cache/restore@v4
        with:
          path: |
            work/toolchain/vc9sp1
            work/toolchain/vc71tk
            work/toolchain/wineprefix
          key: toolchains-${{ env.WINE_VERSION }}-${{ hashFiles('tools/ci/toolchain.sha256', 'tools/ci/setup_toolchain.sh', 'tools/ci/is_unpack.py') }}

      - name: Start a virtual display for wine
        run: |
          Xvfb :99 -screen 0 1024x768x16 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Build and verify the toolchains
        timeout-minutes: 20
        run: sh tools/ci/setup_toolchain.sh

      - name: Restore the open-source library downloads
        id: osscache
        uses: actions/cache/restore@v4
        with:
          path: work/toolchain/downloads/oss
          key: oss-sources-v1

      - name: Download and verify the open-source library sources
        timeout-minutes: 10
        run: sh tools/ci/setup_oss.sh

      - name: Save the open-source library downloads
        if: steps.osscache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/toolchain/downloads/oss
          key: oss-sources-v1

      - name: Save the extracted toolchains and wine prefix
        if: steps.tccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            work/toolchain/vc9sp1
            work/toolchain/vc71tk
            work/toolchain/wineprefix
          key: toolchains-${{ env.WINE_VERSION }}-${{ hashFiles('tools/ci/toolchain.sha256', 'tools/ci/setup_toolchain.sh', 'tools/ci/is_unpack.py') }}
