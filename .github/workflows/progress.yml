# Refresh PROGRESS.md after every change to main that can move the numbers (tools/ci/progress.py).
# Commits made with GITHUB_TOKEN do not start workflows, so this cannot loop.
name: Update PROGRESS.md

on:
  push:
    branches: [main]
    paths:
      - "**/manifest.txt"
      - "match/clones.txt"
      - "match/synth/*.manifest"
      - "tools/ci/known_failures.txt"
      - "tools/ci/fingerprints.jsonl.gz"
      - "tools/ci/progress.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: progress
  cancel-in-progress: true

jobs:
  progress:
    name: Count byte-exact functions and bytes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --break-system-packages pefile
      - run: python3 tools/ci/progress.py
      - name: Commit if changed
        run: |
          # the timestamp line always changes: commit only when a number did
          if git diff -U0 PROGRESS.md | grep '^[-+][^-+]' | grep -v 'Generated by' | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PROGRESS.md
            git commit -m "PROGRESS.md: update"
            git push
          else
            echo "numbers unchanged"
          fi
