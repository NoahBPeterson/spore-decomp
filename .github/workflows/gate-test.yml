# Rehearsal of the contribution gate on a GitHub runner: build both compilers from Microsoft's public installers,
# check them against tools/ci/toolchain.sha256, then compile a sample of byte-exact manifests and check every row
# against its retail fingerprint (tools/ci/gate.py).  No retail binary on the runner.
name: gate-test

on:
  push:
    branches: [ci/gate-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install wine (WineHQ stable, 32-bit), msitools, Python packages
        run: |
          # Ubuntu's wine 9.0 hung in the VC 2003 Toolkit installer; the Mac runs wine 11
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -qO /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -qNP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --install-recommends winehq-stable msitools xvfb >/dev/null
          wine --version
          python3 -m pip install --quiet --break-system-packages pefile capstone

      - name: Start a virtual display for wine
        run: |
          Xvfb :99 -screen 0 1024x768x16 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Cache installers
        uses: actions/cache@v4
        with:
          path: work/toolchain/downloads
          key: msvc-installers-7800d037-50dc6cca

      - name: Build and verify the toolchains
        timeout-minutes: 20
        run: sh tools/ci/setup_toolchain.sh

      - name: Gate the sample manifests
        run: python3 tools/ci/gate.py $(cat tools/ci/sample_manifests.txt) --fingerprints tools/ci/fingerprints_sample.jsonl --jobs 4 --json gate.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results
          path: gate.json
