# Byte-match check for pull requests: does the contributed C++ compile to exactly the retail game's bytes?
#
# Runs main's workflow and tools on the pull request's files (pull_request_target), so a pull request cannot change
# what checks it: tools/ci/pr_files.py takes only src/game/, match/slices/ and match/include/ from the pull request and
# fails on anything else.  The contributed code is only compiled, never run; the token is read-only and the job has
# no secrets.  No game file is on the runner: functions are compared with retail fingerprints
# (tools/ci/fingerprints.jsonl, tools/ci/fingerprint.py).
#
# Passes when every manifest the pull request can affect (tools/ci/affected.py) matches its fingerprints, apart from
# tools/ci/known_failures.txt, no function that matched on main has been dropped from the manifests, and at least one
# function is byte-exact, or newly proven equivalent (equivalent.txt), that was not on main (unless the pull request
# changes only nonmatching.txt / partial.txt notes). Proven-equivalent rows also need the equiv-verified label.
name: Byte-match check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  workflow_dispatch:
    inputs:
      pr:
        description: pull request number to check
        required: true

permissions:
  contents: read

concurrency:
  group: byte-match-${{ github.event.pull_request.number || github.event.merge_group.head_sha || inputs.pr }}
  cancel-in-progress: true

jobs:
  byte-match:
    name: Compile with MSVC and compare against retail fingerprints
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # the base branch's current tip, not pull_request.base.sha: that stays at the commit the pull request was opened
      # (or last pushed) against, so a rerun after main moved would test against an old main with old tools
      - name: Check out the base branch (tools and workflow come from here)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.ref || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pull request's commits
        id: refs
        env:
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ -n "$MG_HEAD" ]; then
            git fetch -q origin "$MG_HEAD"
            echo "head=$MG_HEAD" >> "$GITHUB_OUTPUT"
          else
            git fetch -q origin "+refs/pull/$PR/head:refs/remotes/pr/head"
            echo "head=refs/remotes/pr/head" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The downloaded .deb files are cached (warm-caches.yml fills the cache on main: pull_request_target runs may read
      # caches but not write them). apt still unpacks and configures, but skips the ~300 MB of downloads.
      - name: Restore the cached wine packages
        id: aptcache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-noble-winehq-v1

      - name: Install wine (WineHQ stable, 32-bit), msitools, Python packages
        run: |
          mkdir -p ~/apt-archives/partial
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -qO /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -qNP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          if sh tools/ci/apt_update.sh; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              -o Dir::Cache::Archives="$HOME/apt-archives" winehq-stable msitools xvfb >/dev/null
          else
            sh tools/ci/install_cached_debs.sh "$HOME/apt-archives"
          fi
          sudo chmod -R a+rX ~/apt-archives
          python3 -m pip install --quiet --break-system-packages pefile capstone
          echo "WINE_VERSION=$(wine --version)" >> "$GITHUB_ENV"


      - name: List the functions that match on the base branch
        run: |
          python3 - "$RUNNER_TEMP/keep_where.txt" <<'EOF' > "$RUNNER_TEMP/keep.txt"
          import os, sys; sys.path[:0] = ["tools/ci", "tools/matching"]
          import gate, run_all
          pairs = sorted({("%08x" % r[2], os.path.relpath(m)) for m in gate.all_manifests() for r in run_all.read_rows([m], "")})
          with open(sys.argv[1], "w") as f:   # every (va, manifest) row on the base branch, for the re-match report below
              f.write("".join("%s %s\n" % p for p in pairs))
          eq = sorted({("%08x" % r[2], os.path.relpath(m)) for m in gate.all_equivalent() for r in run_all.read_rows([m], "")})
          with open(os.path.join(os.path.dirname(sys.argv[1]), "equiv_base.txt"), "w") as f:   # proven-equivalent rows
              f.write("".join("%s %s\n" % p for p in eq))
          print("\n".join(sorted({v for v, _m in pairs})))
          EOF
          wc -l < "$RUNNER_TEMP/keep.txt"

      - name: Take the pull request's contribution files
        run: python3 tools/ci/pr_files.py "${{ steps.refs.outputs.base }}" "${{ steps.refs.outputs.head }}" --changed-out "$RUNNER_TEMP/changed.txt"

      - name: Find the manifests the change can affect
        id: affected
        run: |
          python3 tools/ci/affected.py --from-file "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/manifests.txt"
          echo "count=$(wc -l < "$RUNNER_TEMP/manifests.txt")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/manifests.txt"

      - name: Start a virtual display for wine
        if: steps.affected.outputs.count != '0'
        run: |
          Xvfb :99 -screen 0 1024x768x16 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Cache installers
        if: steps.affected.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: work/toolchain/downloads
          key: msvc-installers-7800d037-50dc6cca

      # The extracted compilers and the wine prefix, from warm-caches.yml: setup_toolchain.sh skips what exists and still
      # checks every file's SHA-256 against tools/ci/toolchain.sha256. A wine prefix belongs to one wine version.
      - name: Restore the extracted toolchains and wine prefix
        id: tccache
        if: steps.affected.outputs.count != '0'
        uses: actions/cache/restore@v4
        with:
          path: |
            work/toolchain/vc9sp1
            work/toolchain/vc71tk
            work/toolchain/wineprefix
          key: toolchains-${{ env.WINE_VERSION }}-${{ hashFiles('tools/ci/toolchain.sha256', 'tools/ci/setup_toolchain.sh', 'tools/ci/is_unpack.py') }}

      - name: Build and verify the toolchains
        if: steps.affected.outputs.count != '0'
        timeout-minutes: 20
        run: sh tools/ci/setup_toolchain.sh

      # jpeg-6a, libpng, zlib, OpenSSL 0.9.8g and EA's EAWebKit 1.21 support packages (~19 MB, from warm-caches.yml):
      # rows matched against upstream library code compile them from work/ (git-ignored; THIRD_PARTY.md)
      - name: Restore the open-source library downloads
        if: steps.affected.outputs.count != '0'
        uses: actions/cache/restore@v4
        with:
          path: work/toolchain/downloads/oss
          key: oss-sources-v1

      - name: Unpack and configure the open-source library sources
        if: steps.affected.outputs.count != '0'
        timeout-minutes: 10
        run: sh tools/ci/setup_oss.sh

      - name: Compile the affected manifests and check each function's bytes
        if: steps.affected.outputs.count != '0'
        run: |
          python3 tools/ci/gate.py $(cat "$RUNNER_TEMP/manifests.txt") --keep "$RUNNER_TEMP/keep.txt" \
            --jobs 4 --json byte-match.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Nothing to compile
        if: steps.affected.outputs.count == '0'
        run: echo "No manifest is affected by this change." | tee -a "$GITHUB_STEP_SUMMARY"

      # Only matches change code (2026-11-11): an attempt that does not match yet passes every other step without any
      # measurable progress. A pull request that changes only notes (nonmatching.txt / partial.txt: what was tried,
      # what still differs) is fine; anything else must add a byte-exact function.
      - name: Require a new byte-exact function, unless only notes change
        # `cleanup-approved`: a maintainer's label for a readability cleanup (members instead of byte offsets, real
        # types instead of casts) that adds no match. Everything else still applies: every function that matched
        # before must still match.
        env:
          CLEANUP: ${{ contains(github.event.pull_request.labels.*.name, 'cleanup-approved') || github.event_name == 'merge_group' }}
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
        run: |
          # pipefail: without it the step takes tee's exit status, and the script's sys.exit(1) never failed a check.
          set -o pipefail
          python3 - "$RUNNER_TEMP/keep.txt" byte-match.json "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/keep_where.txt" <<'EOF2' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections, json, os, sys
          sys.path[:0] = ["tools/ci", "tools/matching"]
          import gate, run_all, offsets
          keep = {l.split()[0].lower() for l in open(sys.argv[1]) if l.strip()}
          rows = json.load(open(sys.argv[2])) if os.path.exists(sys.argv[2]) else []
          changed = [l.strip() for l in open(sys.argv[3]) if l.strip()]
          new = sorted({r["va"] for r in rows if r["tag"] == "PASS" and r["va"] not in keep and r.get("kind") != "equivalent"})
          # Rows this pull request adds whose function was already byte-exact on the base branch, often through a
          # generated file (match/synth/*.manifest, match/clones.txt): they are not new matches.
          base = collections.defaultdict(list)
          for l in open(sys.argv[4]):
              v, m = l.split(None, 1)
              base[v].append(m.strip())
          head = {("%08x" % r[2], os.path.relpath(m)) for m in gate.all_manifests() for r in run_all.read_rows([m], "")}
          passed = {r["va"] for r in rows if r["tag"] == "PASS"}
          rematch = sorted(v for v, m in head if v in keep and v in passed and m not in base[v])
          if rematch:
              by = collections.defaultdict(list)
              for v in sorted(set(rematch)):
                  by[base[v][0]].append(v)
              print("Already byte-exact on main, so not new matches (%d):" % len(set(rematch)))
              for m in sorted(by):
                  vs = by[m]
                  print("- already matched by `%s`: %s%s" % (m, ", ".join("`0x%s`" % v for v in vs[:20]),
                                                             " and %d more" % (len(vs) - 20) if len(vs) > 20 else ""))
          # Proven-equivalent rows. A row counts as new only when this pull request adds it, it builds to its proved
          # bytes, and its function was neither byte-exact nor proven equivalent on main. Rows it adds for such
          # functions are listed as re-proofs. Rows it adds or whose proof file it changes need a maintainer's
          # re-check (next step); rows it only removes do not.
          eq_base = collections.defaultdict(list)
          ebf = os.path.join(os.path.dirname(sys.argv[4]), "equiv_base.txt")
          for l in (open(ebf) if os.path.exists(ebf) else []):
              v, m = l.split(None, 1)
              eq_base[v].append(m.strip())
          eq_head = {("%08x" % r[2], os.path.relpath(m)) for m in gate.all_equivalent() for r in run_all.read_rows([m], "")}
          eq_added = {(v, m) for v, m in eq_head if m not in eq_base[v]}
          proved = {r["va"] for r in rows if r["tag"] == "EQUIV"}
          neweq = sorted({v for v, m in eq_added if v in proved and v not in keep and not eq_base[v]})
          reproof = sorted({v for v, m in eq_added if v in keep or eq_base[v]})
          heads = {v for v, m in eq_head}
          proof_changed = {os.path.basename(p)[:-5].lower() for p in changed if "/equivalent/" in p and p.endswith(".json")}
          touched = sorted({v for v, m in eq_added} | (proof_changed & heads))
          with open(os.path.join(os.path.dirname(sys.argv[4]), "equiv_touched.txt"), "w") as f:
              f.write("".join(v + "\n" for v in touched))
          if reproof:
              print("Proven-equivalent rows for functions already byte-exact or already proven on main, so not new (%d): %s%s"
                    % (len(reproof), ", ".join("`0x%s`" % v for v in reproof[:20]),
                       " and %d more" % (len(reproof) - 20) if len(reproof) > 20 else ""))
          if new:
              print("New byte-exact functions: " + ", ".join("`0x%s`" % v for v in new))
          if neweq:
              print("Newly proven-equivalent functions (re-verified by a maintainer before merging): " + ", ".join("`0x%s`" % v for v in neweq))
          # Names that claim another address than retail uses at that spot (tools/ci/targets.py, #458): an address in
          # the name, or a mangled name recorded on one address. Fails for this pull request's new matches; older rows
          # in the affected manifests are listed for information.
          badt = [r for r in rows if r.get("targets") and r["va"] in set(new)]
          oldt = [r for r in rows if r.get("targets") and r["va"] not in set(new)]
          if badt:
              print("New matches whose names point somewhere other than retail does (the bytes match only because")
              print("addresses are masked):")
              for r in badt:
                  for l in r["targets"]:
                      print("- `0x%s` %s" % (r["va"], l))
              print("Fix the name or the source so it refers to what retail uses there (or the symbols/ line, if that is")
              print("what is wrong).")
          if oldt:
              print("Older matches in the affected manifests with the same problem (not this pull request's): " +
                    ", ".join("`0x%s`" % r["va"] for r in oldt[:20]) + (" and %d more" % (len(oldt) - 20) if len(oldt) > 20 else ""))
          if new or neweq:
              pass
          elif changed and all(os.path.basename(p) in ("nonmatching.txt", "partial.txt") for p in changed):
              print("Notes only (nonmatching.txt / partial.txt): no new match needed.")
          elif offsets.compare(os.environ["BASE"], os.environ["HEAD"])["cleanup"]:
              o = offsets.compare(os.environ["BASE"], os.environ["HEAD"])
              print("Cleanup: byte offsets in the changed files go from %d to %d and no file gains any"
                    " (tools/ci/offsets.py), so no new match is needed; every function that matched before still has to."
                    % (o["before"], o["after"]))
          elif os.environ.get("CLEANUP") == "true":
              print("Cleanup approved by a maintainer (`cleanup-approved`): no new match needed; every function that")
              print("matched before still has to.")
          else:
              print("This pull request changes code but adds no new byte-exact or newly proven-equivalent function")
              print("(nothing passes here that was not already byte-exact or proven on main). Code changes are merged")
              print("only when they add one.")
              if rematch:
                  print("Every function listed above already matches through the file named beside it (match/synth/*")
                  print("and match/clones.txt are generated matches and count): pick functions no manifest lists yet.")
              else:
                  print("What you tried can go in as a notes-only pull request (AGENTS.md, step 7).")
              sys.exit(1)
          if badt:
              sys.exit(1)
          EOF2

      # No inline assembly without a maintainer's approval (2026-11-11): any `__asm` / `_emit` / `naked` line the pull
      # request adds fails the check unless a maintainer has put the `asm-approved` label on it (contributors cannot set
      # labels). Contributors ask for it with an `asm-override: <why>` line in the pull request body (AGENTS.md).
      # Proven-equivalent rows (equivalent.txt + equivalent/<va>.json, tools/contrib/prove.py, 2026-11-12): CI can only
      # check that the row still builds to the bytes its proof is about; the proof needs the game, so a maintainer
      # re-runs `prove.py <va> --recheck` and then puts the `equiv-verified` label on the pull request.
      - name: Proven-equivalent rows need a maintainer's re-check
        if: always() && steps.refs.outcome == 'success'
        env:
          VERIFIED: ${{ contains(github.event.pull_request.labels.*.name, 'equiv-verified') || github.event_name == 'merge_group' }}
        run: |
          # equiv_touched.txt (previous step): rows this pull request adds, or whose proof file it changes. Rows it only
          # removes (for example because the function became byte-exact) need no re-check. Without the file (the
          # previous step did not run), fall back to any change under an equivalence file.
          if [ -f "$RUNNER_TEMP/equiv_touched.txt" ] && [ ! -s "$RUNNER_TEMP/equiv_touched.txt" ]; then
            echo "No proven-equivalent rows added or changed." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ ! -f "$RUNNER_TEMP/equiv_touched.txt" ] && ! grep -qE '(^|/)equivalent(\.txt$|/)' "$RUNNER_TEMP/changed.txt"; then
            echo "No proven-equivalent rows changed." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$VERIFIED" = "true" ]; then
            echo "Proven-equivalent rows re-checked by a maintainer (equiv-verified)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            { echo "This pull request adds or changes proven-equivalent rows. A maintainer re-runs"
              echo "'tools/contrib/prove.py <address> --recheck' for each and then adds the equiv-verified label."; } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: No inline assembly unless a maintainer approved it
        if: always() && steps.refs.outcome == 'success'
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'asm-approved') }}
        run: |
          if python3 tools/ci/asm_check.py "${{ steps.refs.outputs.base }}" "${{ steps.refs.outputs.head }}" > "$RUNNER_TEMP/asm.txt"; then
            echo "No inline assembly added." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$APPROVED" = "true" ]; then
            { echo "Inline assembly added, approved by a maintainer (asm-approved):"; sed 's/^/    /' "$RUNNER_TEMP/asm.txt"; } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            { echo "This pull request adds inline assembly, which is not merged without a maintainer's approval:"
              sed 's/^/    /' "$RUNNER_TEMP/asm.txt"
              echo "Write it as C++. If a short helper really is the only faithful spelling, add a line"
              echo "'asm-override: <why the original needs it>' to the pull request body and a maintainer will decide"
              echo "(AGENTS.md, Rules)."; } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Third-party code (decision 2026-11-20, THIRD_PARTY.md): open-source library source is #included from work/
      # (tools/ci/setup_oss.sh), never copied in, since some of it (OpenSSL 0.9.8g) cannot be combined with GPL-2.0.
      - name: No copied third-party source
        if: always() && steps.refs.outcome == 'success'
        run: |
          if python3 tools/ci/license_check.py "${{ steps.refs.outputs.base }}" "${{ steps.refs.outputs.head }}" --notices > "$RUNNER_TEMP/notices.txt"; then
            echo "No third-party copyright or license notices added." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            { echo "This pull request adds lines with a third-party copyright or license notice:"
              sed 's/^/    /' "$RUNNER_TEMP/notices.txt"
              echo "Open-source library source is not copied into the repository: #include the published file from"
              echo "work/ (tools/ci/setup_oss.sh fetches it) instead (THIRD_PARTY.md)."; } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Matches of open-source library functions add nothing to Spore's own code and are counted apart from it; a
      # maintainer checks that each one compiles the published source unchanged, then adds the oss-reviewed label.
      - name: Open-source library matches need a maintainer's review
        if: always() && steps.refs.outcome == 'success'
        env:
          REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'oss-reviewed') || github.event_name == 'merge_group' }}
        run: |
          if python3 tools/ci/license_check.py "${{ steps.refs.outputs.base }}" "${{ steps.refs.outputs.head }}" --oss > "$RUNNER_TEMP/oss.txt"; then
            echo "No open-source library functions added." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$REVIEWED" = "true" ]; then
            echo "$(wc -l < "$RUNNER_TEMP/oss.txt") open-source library functions added, reviewed by a maintainer (oss-reviewed)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            { echo "This pull request adds $(wc -l < "$RUNNER_TEMP/oss.txt") open-source library functions (first 20):"
              head -20 "$RUNNER_TEMP/oss.txt" | sed 's/^/    /'
              echo "A maintainer checks that they compile the published source unchanged and adds the oss-reviewed"
              echo "label (THIRD_PARTY.md)."; } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Readable source names members instead of casting and adding byte offsets. More matching functions matter far
      # more than fewer offsets, so this only warns (decision 2026-11-20): each file that gains some, and each new file
      # that has some, gets a warning annotation. A pull request that lowers them passes as a cleanup (step above).
      - name: Byte offsets (warnings only)
        if: always() && steps.refs.outcome == 'success'
        run: |
          python3 tools/ci/offsets.py "${{ steps.refs.outputs.base }}" "${{ steps.refs.outputs.head }}" --json "$RUNNER_TEMP/offsets.json" > "$RUNNER_TEMP/offsets.txt" || true
          sed 's/^/    /' "$RUNNER_TEMP/offsets.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -f "$RUNNER_TEMP/offsets.json" ] && python3 - "$RUNNER_TEMP/offsets.json" <<'EOF2'
          import json, sys
          r = json.load(open(sys.argv[1]))
          for f in r["increased"]:
              print("::warning file=%s::byte offsets (like *(T*)(p + N) or (char*)this) %d -> %d: naming the members reads better (AGENTS.md, Rules)" % (f["path"], f["before"], f["after"]))
          for f in r["new_with"]:
              print("::warning file=%s::%d byte offsets (like *(T*)(p + N) or (char*)this) in a new file: naming the members reads better (AGENTS.md, Rules)" % (f["path"], f["after"]))
          EOF2
          true

      - name: Upload results
        if: always() && steps.affected.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: byte-match-results
          path: byte-match.json
          if-no-files-found: ignore
